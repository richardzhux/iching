[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iching"
version = "0.1.0"
description = "I Ching core engine + FastAPI surface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click==8.4.1",
  "colorama==0.4.6",
  "common==0.1.2",
  "datas==0.2.9",
  "fastapi==0.136.3",
  "graphviz==0.20.3",
  "httpx==0.28.1",
  "lunar_python==1.4.8",
  "openai==2.45.0",
  "pydantic==2.13.4",
  "psutil==7.0.0",
  "python-dotenv==1.2.2",
  "selenium==4.44.0",
  "streamlit==1.58.0",
  "uvicorn[standard]==0.48.0",
  "sxtwl==2.0.7",
  "yue==0.0.1004",
  "urllib3>=2.7.0,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"iching.core" = ["data/*.json"]
"iching.core.bazi_rules" = ["bundles/*.json"]
